                  <td rowSpan={rows.length} className="px-4 py-2 text-center align-middle">
                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-lg ${pc.bg} ${pc.text}`}>{label.toUpperCase()}</span>
                  </td>

                <td className="px-4 py-2 text-sm text-gray-700">{r.responsable}</td>

              <td className={`px-4 py-1.5 text-right font-mono font-black text-sm ${pc.text}`}>{sp}</td>

            <div className="grid grid-cols-3 gap-4">
              {[

                { label:'Procesos',      value:TD_NEGO.procesos,      icon:'⬢', color:'bg-ng-verde'  },
                { label:'Procedimientos',value:TD_NEGO.procedimientos, icon:'⬟', color:'bg-ng-claro'  },

                  <div className={`px-4 py-3 text-white ${k.color}`}>
                    <div className="text-[10px] font-bold uppercase tracking-widest opacity-75">{k.label}</div>
                    <div className="font-montserrat font-black text-3xl mt-0.5">{k.value}</div>
                  </div>
                  <div className="px-4 py-1.5 text-[9px] text-gray-400">Solo entidad NEGOFIN SA</div>

          {/* KPI — Total sistema */}
          <div>
            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2 px-1">TOTAL SISTEMA — NEGOFIN SA + Aliados Comerciales</p>
            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              {[
                { label:'Procedimientos totales', value:total,   sub:'Ambas entidades',         color:'bg-emerald-700' },
                { label:'Manual',                 value:manual,  sub:`${pctMan}% del total`,    color:'bg-amber-500'   },
                { label:'Semiautomático',          value:semi,    sub:`${pctSemi}% del total`,   color:'bg-blue-500'    },
                { label:'Automático',              value:auto,    sub:`${pctAuto}% automatizado`, color:'bg-green-600'   },
              ].map(k => (
                <div key={k.label} className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                  <div className={`px-4 py-3 text-white ${k.color}`}>

    /* ══════════════════════════════
       ECOSISTEMA
    ══════════════════════════════ */
    function Ecosistema() {
      const [fEnt,   setFEnt]   = useState('Todos');
      const [fTipo,  setFTipo]  = useState('Todos');
      const [vista,  setVista]  = useState('responsable'); // 'responsable' | 'macro'

      const entidades = ['Todos', ...uniq(PROC_RAW, r => r.ent)];
      const tipos     = ['Todos', 'Primario', 'Soporte', 'Gestión'];

      const filtered = useMemo(() => {
        return PROC_RAW.filter(r =>
          (fEnt  === 'Todos' || r.ent === fEnt) &&
          (fTipo === 'Todos' || r.tm  === fTipo)
        );
      }, [fEnt, fTipo]);

      /* Vista por Responsable */
      const byResponsable = useMemo(() => {
        const map = {};
        filtered.forEach(r => {
          if (!r.rs) return;
          if (!map[r.rs]) map[r.rs] = { total:0, manual:0, semi:0, auto:0, macros:new Set(), tipos:new Set() };
          map[r.rs].total++;
          map[r.rs].macros.add(r.mp);
          map[r.rs].tipos.add(r.tm);
          if (r.cl==='Manual')          map[r.rs].manual++;
          else if (r.cl==='Semiautomático') map[r.rs].semi++;
          else                          map[r.rs].auto++;
        });
        return Object.entries(map).map(([name, st]) => ({
          name, ...st,
          macros: st.macros.size,
          tipos:  [...st.tipos].sort(),
          pctAuto: st.total ? ((st.auto/st.total)*100).toFixed(0) : 0,
        })).sort((a,b) => b.total-a.total);
      }, [filtered]);

      /* Vista por Macroproceso */
      const byMacro = useMemo(() => {
        const map = {};
        filtered.forEach(r => {
          if (!r.mp) return;
          if (!map[r.mp]) map[r.mp] = { total:0, manual:0, semi:0, auto:0, tipo:r.tm, resps:new Set() };
          map[r.mp].total++;
          map[r.mp].resps.add(r.rs);
          if (r.cl==='Manual')          map[r.mp].manual++;
          else if (r.cl==='Semiautomático') map[r.mp].semi++;
          else                          map[r.mp].auto++;
        });
        return Object.entries(map).map(([name, st]) => ({
          name, ...st, resps: st.resps.size,
          pctAuto: st.total ? ((st.auto/st.total)*100).toFixed(0) : 0,
        })).sort((a,b) => {
          const order = {Primario:0, Gestión:1, Soporte:2};
          return (order[a.tipo]??3) - (order[b.tipo]??3) || b.total-a.total;
        });
      }, [filtered]);

      return (
        <div className="space-y-4">
          {/* Controles */}
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 space-y-3">
            <div className="flex flex-wrap gap-4 items-center">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Vista:</span>
                {[['responsable','Por Responsable'],['macro','Por Macroproceso']].map(([v,l]) => (
                  <button key={v} onClick={() => setVista(v)}
                    className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition-all ${
                      vista===v ? 'bg-ng-verde text-white border-ng-verde' : 'bg-white text-gray-600 border-gray-200 hover:border-ng-claro'
                    }`}>{l}</button>
                ))}
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Entidad:</span>
                {entidades.map(e => (
                  <button key={e} onClick={() => setFEnt(e)}
                    className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition-all ${
                      fEnt===e ? 'bg-ng-oscuro text-white border-ng-oscuro' : 'bg-white text-gray-600 border-gray-200 hover:border-ng-claro'
                    }`}>{e}</button>
                ))}
              </div>
              <div className="flex items-center gap-2 flex-wrap">
                <span className="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Tipo Macro:</span>
                {tipos.map(t => (
                  <button key={t} onClick={() => setFTipo(t)}
                    className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition-all ${
                      fTipo===t
                        ? (t==='Todos' ? 'bg-gray-700 text-white border-gray-700' : tipoColor(t)+' border-transparent')
                        : 'bg-white text-gray-600 border-gray-200 hover:border-ng-claro'
                    }`}>{t}</button>
                ))}
              </div>
            </div>
            <div className="flex items-center gap-4 text-[10px] text-gray-400">
              <span><span className="font-bold text-ng-verde">{filtered.length}</span> procedimientos · </span>
              {[{l:'Manual',c:'bg-amber-400'},{l:'Semiautomático',c:'bg-blue-400'},{l:'Automático',c:'bg-green-500'}].map(c=>(
                <span key={c.l} className="flex items-center gap-1"><span className={`w-2.5 h-2.5 rounded-sm ${c.c}`}/>{c.l}</span>
              ))}
            </div>
          </div>

          {/* Vista Responsable */}
          {vista === 'responsable' && (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {byResponsable.map(r => (
                <div key={r.name} className="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow overflow-hidden">
                  <div className="bg-ng-oscuro px-4 py-3">
                    <div className="text-white font-semibold text-xs leading-tight">{r.name}</div>
                    <div className="flex items-center gap-2 mt-1 flex-wrap">
                      {r.tipos.map(t => (
                        <span key={t} className={`text-[8px] font-bold px-1.5 py-0.5 rounded ${tipoColor(t)}`}>{t}</span>
                      ))}
                    </div>
                  </div>
                  <div className="p-4">
                    <div className="flex items-end justify-between">
                      <div>
                        <div className="text-3xl font-montserrat font-black text-ng-oscuro">{r.total}</div>
                        <div className="text-[10px] text-gray-400">{r.macros} macroproceso{r.macros!==1?'s':''}</div>
                      </div>
                      {r.auto > 0 && (
                        <span className="text-[10px] font-bold bg-green-50 text-green-700 px-2 py-0.5 rounded-full border border-green-200">
                          {r.pctAuto}% aut.
                        </span>
                      )}
                    </div>
                    <AutoBar man={r.manual} semi={r.semi} aut={r.auto} total={r.total}/>
                    <div className="flex justify-between mt-1.5 text-[9px] text-gray-400">
                      <span><span className="font-bold text-amber-600">{r.manual}</span> M</span>
                      <span><span className="font-bold text-blue-600">{r.semi}</span> S</span>
                      <span><span className="font-bold text-green-600">{r.auto}</span> A</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Vista Macroproceso */}
          {vista === 'macro' && (
            <div className="space-y-3">
              {['Primario','Gestión','Soporte'].map(tipo => {
                const rows = byMacro.filter(m => m.tipo === tipo);
                if (!rows.length) return null;
                return (
                  <div key={tipo} className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
                    <div className={`px-5 py-2.5 ${tipoColor(tipo)} flex items-center gap-2`}>
                      <span className="font-montserrat font-black text-sm tracking-wide">{tipo}</span>
                      <span className="text-xs opacity-70">{rows.length} macroprocesos · {rows.reduce((s,r)=>s+r.total,0)} procedimientos</span>
                    </div>
                    <div className="divide-y divide-gray-100">
                      {rows.map(m => (
                        <div key={m.name} className="px-5 py-3 flex items-center gap-4 hover:bg-gray-50">
                          <div className="flex-1 min-w-0">
                            <div className="font-medium text-sm text-gray-800 truncate">{m.name}</div>
                            <div className="text-[10px] text-gray-400">{m.resps} responsable{m.resps!==1?'s':''}</div>
                          </div>
                          <div className="w-32 flex-shrink-0">
                            <AutoBar man={m.manual} semi={m.semi} aut={m.auto} total={m.total}/>
                            <div className="flex justify-between text-[9px] text-gray-400 mt-1">
                              <span>{m.manual} M</span>
                              <span>{m.semi} S</span>
                              <span>{m.auto} A</span>
                            </div>
                          </div>
                          <div className="text-right flex-shrink-0 w-12">
                            <div className="font-montserrat font-black text-ng-oscuro text-lg">{m.total}</div>
                          </div>
                          {m.auto > 0 && (
                            <span className="text-[9px] font-bold bg-green-50 text-green-700 px-1.5 py-0.5 rounded-full border border-green-200 flex-shrink-0">
                              {m.pctAuto}%
                            </span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    }

    /* ══════════════════════════════
       CATÁLOGO
    ══════════════════════════════ */
    function Catalogo() {
      const [search, setSearch] = useState('');
      const [fEnt,  setFEnt]  = useState('');
      const [fMp,   setFMp]   = useState('');
      const [fTipo, setFTipo] = useState('');
      const [fRs,   setFRs]   = useState('');
      const [fCl,   setFCl]   = useState('');
      const [fPri,  setFPri]  = useState('');
      const [page,  setPage]  = useState(1);
      const PER = 20;

      const entidades  = useMemo(() => uniq(PROC_RAW, r => r.ent), []);
      const macros     = useMemo(() => uniq(PROC_RAW, r => r.mp), []);
      const resps      = useMemo(() => uniq(PROC_RAW, r => r.rs), []);

      const filtered = useMemo(() => {
        const q = search.toLowerCase();
        return PROC_RAW.filter(r =>
          (!fEnt  || r.ent === fEnt)  &&
          (!fMp   || r.mp  === fMp)   &&
          (!fTipo || r.tm  === fTipo) &&
          (!fRs   || r.rs  === fRs)   &&
          (!fCl   || r.cl  === fCl)   &&
          (!fPri  || r.pri === fPri)  &&
          (!q || [r.mp,r.pr,r.pc,r.rs].some(f => f&&f.toLowerCase().includes(q)))
        );
      }, [search,fEnt,fMp,fTipo,fRs,fCl,fPri]);

      const pages   = Math.max(1, Math.ceil(filtered.length / PER));
      const safePg  = Math.min(page, pages);
      const visible = filtered.slice((safePg-1)*PER, safePg*PER);

      const reset = () => { setSearch('');setFEnt('');setFMp('');setFTipo('');setFRs('');setFCl('');setFPri('');setPage(1); };

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="font-montserrat font-bold text-ng-oscuro text-[10px] uppercase tracking-widest">Filtros</h2>
              <button onClick={reset} className="text-[10px] text-ng-verde font-semibold hover:underline">↺ Limpiar todo</button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <div className="relative">
                <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} placeholder="Buscar procedimiento, proceso, área..."
                  className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-ng-claro"/>
                <svg className="absolute left-2.5 top-1/2 -translate-y-1/2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </div>
              <SelectFiltro val={fEnt}  setVal={v=>{setFEnt(v);setPage(1);}}   opts={entidades}              placeholder="Todas las entidades"/>
              <SelectFiltro val={fTipo} setVal={v=>{setFTipo(v);setPage(1);}}  opts={['Primario','Soporte','Gestión']} placeholder="Todos los tipos"/>
              <SelectFiltro val={fMp}   setVal={v=>{setFMp(v);setPage(1);}}    opts={macros}                 placeholder="Todos los macroprocesos"/>
              <SelectFiltro val={fRs}   setVal={v=>{setFRs(v);setPage(1);}}    opts={resps}                  placeholder="Todos los responsables"/>
              <SelectFiltro val={fCl}   setVal={v=>{setFCl(v);setPage(1);}}    opts={['Manual','Semiautomático','Automático']} placeholder="Toda clasificación"/>
              <SelectFiltro val={fPri}  setVal={v=>{setFPri(v);setPage(1);}}   opts={['Alta','Medio','Bajo']} placeholder="Toda prioridad"/>
            </div>
            <div className="text-[10px] text-gray-400">
              Mostrando <span className="font-bold text-ng-verde">{filtered.length}</span> de {PROC_RAW.length} procedimientos
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-xs min-w-[1000px]">
                <thead>
                  <tr className="bg-ng-suave border-b border-ng-medio">
                    {['N°','Entidad','Tipo','Macroproceso','Proceso','Procedimiento','Responsable','Pasos','Aut.','Clase','Prioridad'].map((h,i) => (
                      <th key={h} className={`py-2.5 text-[9px] font-bold text-ng-oscuro uppercase tracking-wider whitespace-nowrap ${i<=1||i===2?'px-3 text-center':'px-3 text-left'} ${i>=7&&i<=8?'text-right':''}`}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {visible.map((r,i) => {
                    const cc = claseColor(r.cl);
                    const pc = r.pri ? prioColor(r.pri) : null;
                    return (
                      <tr key={i} className="hover:bg-gray-50 transition-colors">
                        <td className="px-3 py-2 text-center font-mono text-gray-400 text-[10px]">{r.id}</td>
                        <td className="px-3 py-2 text-center">
                          <span className="text-[8px] font-bold text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">
                            {r.ent === 'NEGOFIN SA' ? 'NGF' : 'AC'}
                          </span>
                        </td>
                        <td className="px-3 py-2 text-center">
                          <span className={`text-[8px] font-bold px-1.5 py-0.5 rounded ${tipoColor(r.tm)}`}>{r.tm?.slice(0,3)}</span>
                        </td>
                        <td className="px-3 py-2 text-gray-700 max-w-[180px]"><div className="truncate" title={r.mp}>{r.mp}</div></td>
                        <td className="px-3 py-2 text-gray-600 max-w-[140px]"><div className="truncate" title={r.pr}>{r.pr}</div></td>
                        <td className="px-3 py-2 font-medium text-gray-800 max-w-[200px]"><div className="truncate" title={r.pc}>{r.pc}</div></td>
                        <td className="px-3 py-2 text-gray-600 max-w-[160px]"><div className="truncate" title={r.rs}>{r.rs}</div></td>
                        <td className="px-3 py-2 text-right font-mono">{r.pa??'—'}</td>
                        <td className="px-3 py-2 text-right font-mono">{r.pA!=null?r.pA:'—'}</td>
                        <td className="px-3 py-2">
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full whitespace-nowrap ${cc.bg} ${cc.text}`}>{r.cl}</span>
                        </td>
                        <td className="px-3 py-2">
                          {pc && <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${pc.bg} ${pc.text}`}>{r.pri}</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <div className="px-4 py-3 bg-gray-50 border-t border-gray-100 flex items-center justify-between flex-wrap gap-3">
              <span className="text-[10px] text-gray-400">Página {safePg} de {pages} · {PER} por página</span>
              <div className="flex gap-2">
                <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={safePg===1}
                  className="px-3 py-1 text-xs font-semibold border border-gray-200 rounded-lg disabled:opacity-30 hover:border-ng-claro hover:text-ng-verde transition-colors">
                  ← Anterior
                </button>
                <button onClick={()=>setPage(p=>Math.min(pages,p+1))} disabled={safePg===pages}
                  className="px-3 py-1 text-xs font-semibold border border-gray-200 rounded-lg disabled:opacity-30 hover:border-ng-claro hover:text-ng-verde transition-colors">
                  Siguiente →
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════
       MEJORAS
    ══════════════════════════════ */
    function Mejoras() {
      const conMejora = useMemo(() =>
        PROC_RAW.filter(r => r.an || r.im || r.rop || r.fe || r.tmj || r.pri === 'Alta'), []);

      const [search, setSearch] = useState('');
      const [fPri,   setFPri]   = useState('');
      const [fRs,    setFRs]    = useState('');
      const resps = useMemo(() => uniq(conMejora, r => r.rs), []);

      const filtered = useMemo(() => {
        const q = search.toLowerCase();
        return conMejora.filter(r =>
          (!fPri || r.pri === fPri) &&
          (!fRs  || r.rs  === fRs) &&
          (!q || [r.mp,r.pc,r.rs].some(f => f&&f.toLowerCase().includes(q)))
        );
      }, [conMejora, search, fPri, fRs]);

      return (
        <div className="space-y-4">
          {/* KPIs */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            {[
              {label:'Priorizados',    val:conMejora.length,                       color:'bg-ng-oscuro'},
              {label:'Con Analista',   val:conMejora.filter(r=>r.an).length,        color:'bg-ng-verde'},
              {label:'Revisados OyP',  val:conMejora.filter(r=>r.rop==='SI').length, color:'bg-emerald-700'},
              {label:'Con Tipo Mejora',val:conMejora.filter(r=>r.tmj).length,       color:'bg-blue-600'},
            ].map(k => (
              <div key={k.label} className={`rounded-2xl p-4 text-white ${k.color}`}>
                <div className="text-[10px] font-bold opacity-70 uppercase tracking-wider">{k.label}</div>
                <div className="font-montserrat font-black text-3xl mt-1">{k.val}</div>
              </div>
            ))}
          </div>

          {/* Filtros */}
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 flex flex-wrap gap-3 items-center">
            <div className="relative flex-1 min-w-[180px]">
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Buscar..."
                className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-ng-claro"/>
              <svg className="absolute left-2.5 top-1/2 -translate-y-1/2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            </div>
            <div className="min-w-[140px]"><SelectFiltro val={fPri} setVal={setFPri} opts={['Alta','Medio','Bajo']} placeholder="Toda prioridad"/></div>
            <div className="min-w-[200px]"><SelectFiltro val={fRs}  setVal={setFRs}  opts={resps}                   placeholder="Todos los responsables"/></div>
            <span className="text-[10px] text-gray-400">{filtered.length} registros</span>
          </div>

          {/* Tabla */}
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-xs min-w-[1050px]">
                <thead>
                  <tr className="bg-ng-suave border-b border-ng-medio">
                    {['Procedimiento','Responsable','Prioridad','Tipo','Impacto','Rev. OyP','Fecha','Analista','Resp. Mejora','Tipo Mejora'].map(h => (
                      <th key={h} className="px-3 py-2.5 text-[9px] font-bold text-ng-oscuro uppercase tracking-wider text-left whitespace-nowrap">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {filtered.map((r,i) => {
                    const pc = r.pri ? prioColor(r.pri) : null;
                    return (
                      <tr key={i} className="hover:bg-gray-50">
                        <td className="px-3 py-2 max-w-[200px]">
                          <div className="font-medium text-gray-800 truncate" title={r.pc}>{r.pc}</div>
                          <div className="text-[9px] text-gray-400 truncate" title={r.mp}>{r.mp}</div>
                        </td>
                        <td className="px-3 py-2 text-gray-600 whitespace-nowrap">{r.rs}</td>
                        <td className="px-3 py-2">
                          {pc && <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full ${pc.bg} ${pc.text}`}>{r.pri}</span>}
                        </td>
                        <td className="px-3 py-2 text-gray-500">{r.tp||'—'}</td>
                        <td className="px-3 py-2 text-gray-500 whitespace-nowrap">{r.im||'—'}</td>
                        <td className="px-3 py-2 text-center">
                          {r.rop==='SI'
                            ? <span className="text-[9px] bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-full">SI</span>
                            : r.rop==='En proceso'
                              ? <span className="text-[9px] bg-yellow-100 text-yellow-700 font-bold px-2 py-0.5 rounded-full">En proceso</span>
                              : <span className="text-gray-300">—</span>
                          }
                        </td>
                        <td className="px-3 py-2 text-gray-500 whitespace-nowrap">{r.fe||'—'}</td>
                        <td className="px-3 py-2 font-medium text-gray-700">{r.an||'—'}</td>
                        <td className="px-3 py-2 text-gray-600">{r.rm||'—'}</td>
                        <td className="px-3 py-2">
                          {r.tmj
                            ? <span className="text-[9px] bg-purple-100 text-purple-700 font-bold px-2 py-0.5 rounded-full whitespace-nowrap">{r.tmj}</span>
                            : <span className="text-gray-300">—</span>
                          }
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Indicador Cobranzas */}
          <IndCobranzas />
        </div>
      );
    }

    /* ══════════════════════════════
       IND. COBRANZAS
    ══════════════════════════════ */
    function IndCobranzas() {
      const { total_procesos, manual_semi, obj_mejora_anual, cant_pro_mejora, meses } = IND_COB;
      const maxVal = Math.max(...meses.map(m => m.objetivo), cant_pro_mejora, 1);

      /* Paso a paso de Cobranzas desde BD */
      const totalPasos = COB_BD.reduce((s,r)=>s+(r.pa||0), 0);
      const totalAut   = COB_BD.reduce((s,r)=>s+(r.pA||0), 0);
      const pctGlobal  = totalPasos ? ((totalAut/totalPasos)*100).toFixed(1) : 0;

      return (
        <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
          <div className="px-5 py-3 bg-ng-suave border-b border-ng-medio">
            <h2 className="font-montserrat font-bold text-ng-oscuro text-[10px] uppercase tracking-widest">
              Indicador de Mejora — Gerencia Cobranzas
            </h2>
          </div>
          <div className="p-5 space-y-5">

            {/* KPIs globales */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              {[
                {label:'Total Procesos',   val: total_procesos},
                {label:'Manual + Semi',     val: manual_semi},
                {label:'Obj. Mejora Anual', val: (obj_mejora_anual*100)+'%'},
                {label:'Cant. Pro. Mejora', val: cant_pro_mejora},
              ].map(k => (
                <div key={k.label} className="bg-ng-suave rounded-xl p-3 text-center border border-ng-medio">
                  <div className="font-montserrat font-black text-2xl text-ng-oscuro">{k.val}</div>
                  <div className="text-[10px] text-ng-verde font-semibold mt-0.5">{k.label}</div>
                </div>
              ))}
            </div>

            {/* Seguimiento mensual */}
            <div>
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Seguimiento Mensual de Mejoras</p>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-gray-50 border-b border-gray-200">
                      {['Mes','Mejorados','Acumulado','Objetivo','Avance visual','% vs Meta'].map((h,i)=>(
                        <th key={h} className={`px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider ${i>=1?'text-right':'text-left'}`}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {meses.map((m,i) => {
                      const pct = cant_pro_mejora > 0 ? (m.acumulado/cant_pro_mejora*100) : 0;
                      const ok  = m.objetivo > 0 && m.acumulado >= m.objetivo;
                      return (
                        <tr key={i} className="hover:bg-gray-50">
                          <td className="px-4 py-2 font-semibold text-gray-700">{m.mes}</td>
                          <td className="px-4 py-2 text-right font-mono font-bold text-ng-verde">{m.mejorados||'—'}</td>
                          <td className="px-4 py-2 text-right font-mono text-gray-700">{m.acumulado}</td>
                          <td className="px-4 py-2 text-right font-mono text-gray-500">{m.objetivo}</td>
                          <td className="px-4 py-2 min-w-[120px]">
                            <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                              <div className={`h-full rounded-full ${ok?'bg-green-500':'bg-amber-400'}`}
                                style={{width:`${Math.min(100,(m.acumulado/maxVal)*100)}%`}}/>
                            </div>
                          </td>
                          <td className="px-4 py-2 text-right">
                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${ok?'bg-green-100 text-green-700':'bg-amber-100 text-amber-700'}`}>
                              {pct.toFixed(0)}%
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Análisis paso a paso desde BD */}
            <div>
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">
                Análisis por Paso — Procedimientos Cobranzas (Fuente: BD)
                <span className="ml-2 normal-case font-normal text-gray-400">Automatización global: <span className="font-bold text-ng-verde">{pctGlobal}%</span></span>
              </p>
              <div className="overflow-x-auto">
                <table className="w-full text-xs">
                  <thead>
                    <tr className="bg-gray-50 border-b border-gray-200">
                      {['Procedimiento','Total Pasos','Pasos Aut.','% Aut.','Estado','Barra'].map((h,i)=>(
                        <th key={h} className={`px-3 py-2 text-[9px] font-bold text-gray-400 uppercase tracking-wider ${i>=1&&i<=3?'text-right':'text-left'}`}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-100">
                    {COB_BD.map((r,i) => {
                      const pct = r.pa ? ((r.pA/r.pa)*100).toFixed(0) : 0;
                      const cc = claseColor(r.cl);
                      return (
                        <tr key={i} className="hover:bg-gray-50">
                          <td className="px-3 py-2 font-medium text-gray-800">{r.pc}</td>
                          <td className="px-3 py-2 text-right font-mono">{r.pa}</td>
                          <td className="px-3 py-2 text-right font-mono font-bold text-ng-verde">{r.pA}</td>
                          <td className="px-3 py-2 text-right font-mono font-bold">{pct}%</td>
                          <td className="px-3 py-2">
                            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${cc.bg} ${cc.text}`}>{r.cl}</span>
                          </td>
                          <td className="px-3 py-2 min-w-[100px]">
                            <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                              <div className={`h-full rounded-full ${cc.bar}`} style={{width:pct+'%'}}/>
                            </div>
                          </td>
                        </tr>
                      );
                    })}
                    <tr className="bg-ng-suave font-bold">
                      <td className="px-3 py-2 text-ng-oscuro font-black">TOTAL</td>
                      <td className="px-3 py-2 text-right font-mono text-ng-oscuro">{totalPasos}</td>
                      <td className="px-3 py-2 text-right font-mono text-ng-verde">{totalAut}</td>
                      <td className="px-3 py-2 text-right font-mono text-ng-verde font-black">{pctGlobal}%</td>
                      <td colSpan={2}/>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════
       APP
    ══════════════════════════════ */
    const TABS = [
      { id:'dashboard',  label:'Resumen',    icon:'◈' },
      { id:'ecosistema', label:'Ecosistema', icon:'⬡' },
      { id:'catalogo',   label:'Catálogo',   icon:'≡' },
      { id:'mejoras',    label:'Mejoras',    icon:'⚡' },
    ];

    function App() {
      const [tab, setTab] = useState('dashboard');
      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-ng-oscuro shadow-xl sticky top-0 z-10">
            <div className="max-w-7xl mx-auto px-4 md:px-6 py-4 flex items-center gap-4">
              <div className="bg-white rounded-xl px-3 py-1.5 text-center shadow flex-shrink-0">
                <div className="font-montserrat font-black text-ng-oscuro text-sm leading-tight">NegoFIN</div>
                <div className="font-montserrat font-bold text-ng-oscuro text-[7px] tracking-[2.5px] leading-tight mt-0.5">S.A.E.C.A.</div>
              </div>
              <div className="flex-1 min-w-0">
                <h1 className="font-montserrat font-black text-white text-lg md:text-xl leading-tight">
                  Ecosistema de Procesos Empresariales
                </h1>
                <p className="text-white/45 text-xs mt-0.5">Gerencia de Organización y Procesos · 2026</p>
              </div>
              <div className="hidden sm:block flex-shrink-0 text-right">
                <div className="text-white/35 text-[9px] uppercase tracking-widest font-semibold">Procedimientos</div>
                <div className="font-montserrat font-black text-white text-2xl">{PROC_RAW.length}</div>
              </div>
            </div>
            <div className="border-t border-white/10 px-4 md:px-6 max-w-7xl mx-auto">
              <div className="flex gap-1">
                {TABS.map(t => (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`px-4 py-3 text-xs font-bold transition-all flex items-center gap-1.5 border-b-2 ${
                      tab===t.id ? 'text-white border-ng-claro' : 'text-white/40 border-transparent hover:text-white/70'
                    }`}>
                    <span>{t.icon}</span><span>{t.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>
          <main className="max-w-7xl mx-auto w-full px-4 md:px-6 py-6 flex-1">
            {tab==='dashboard'  && <Dashboard />}
            {tab==='ecosistema' && <Ecosistema />}
            {tab==='catalogo'   && <Catalogo />}
            {tab==='mejoras'    && <Mejoras />}
          </main>
          <footer className="bg-ng-oscuro py-3 px-6 text-center">
            <p className="text-white/25 text-xs">
              <strong className="text-white/50">NegoFIN · Gerencia de Organización y Procesos</strong>
              {' '}· Ecosistema de Procesos Empresariales · 2026
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
