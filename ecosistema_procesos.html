    /* ══════════════════════
       TAB: ECOSISTEMA
    ══════════════════════ */
    function Ecosistema() {
      const [filtroEnt, setFiltroEnt] = useState('Todos');

      const entidades = ['Todos', ...uniq(PROC_RAW, r => r.ent)];

      const data = useMemo(() => {
        const filtered = filtroEnt === 'Todos' ? PROC_RAW : PROC_RAW.filter(r => r.ent === filtroEnt);
        const map = {};
        filtered.forEach(r => {
          if (!r.rs) return;
          if (!map[r.rs]) map[r.rs] = { total: 0, manual: 0, semi: 0, auto: 0, macros: new Set() };
          map[r.rs].total++;
          map[r.rs].macros.add(r.mp);
          if (r.cl === 'Manual')          map[r.rs].manual++;
          else if (r.cl === 'Semiautomático') map[r.rs].semi++;
          else                              map[r.rs].auto++;
        });
        return Object.entries(map).map(([name, st]) => ({
          name, ...st, macros: st.macros.size,
          pctAuto: st.total ? ((st.auto/st.total)*100).toFixed(0) : 0,
          pctSemi: st.total ? ((st.semi/st.total)*100).toFixed(0) : 0,
          pctMan:  st.total ? ((st.manual/st.total)*100).toFixed(0) : 0,
        })).sort((a,b) => b.total - a.total);
      }, [filtroEnt]);

      /* bar component */
      const Bar = ({ man, semi, aut, total }) => (
        <div className="h-2 rounded-full bg-gray-100 overflow-hidden flex mt-2">
          <div className="h-full bg-amber-400"  style={{width: `${(man/total)*100}%`}}/>
          <div className="h-full bg-blue-400"   style={{width: `${(semi/total)*100}%`}}/>
          <div className="h-full bg-green-500"  style={{width: `${(aut/total)*100}%`}}/>
        </div>
      );

      return (
        <div className="space-y-4">
          {/* Filtro entidad */}
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-4">
            <div className="flex items-center gap-3 flex-wrap">
              <span className="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Entidad:</span>
              {entidades.map(e => (
                <button key={e} onClick={() => setFiltroEnt(e)}
                  className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition-all ${
                    filtroEnt === e
                      ? 'bg-ng-verde text-white border-ng-verde shadow'
                      : 'bg-white text-gray-600 border-gray-200 hover:border-ng-claro'
                  }`}>
                  {e}
                </button>
              ))}
            </div>
          </div>

          {/* Leyenda */}
          <div className="flex items-center gap-4 px-1 flex-wrap">
            {[
              {label:'Manual',       color:'bg-amber-400'},
              {label:'Semiautomático',color:'bg-blue-400'},
              {label:'Automático',    color:'bg-green-500'},
            ].map(c=>(
              <div key={c.label} className="flex items-center gap-1.5 text-xs text-gray-500">
                <span className={`w-3 h-3 rounded-sm ${c.color}`}/>{c.label}
              </div>
            ))}
          </div>

          {/* Grid de responsables */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            {data.map(r => (
              <div key={r.name} className="bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md transition-shadow overflow-hidden">
                <div className="bg-ng-oscuro px-4 py-3">
                  <div className="text-white font-semibold text-xs leading-tight">{r.name}</div>
                  <div className="text-white/50 text-[10px] mt-0.5">{r.macros} macroproceso{r.macros !== 1 ? 's' : ''}</div>
                </div>
                <div className="p-4">
                  <div className="text-3xl font-montserrat font-black text-ng-oscuro">{r.total}</div>
                  <div className="text-[10px] text-gray-400 mb-2">procedimientos</div>
                  <Bar man={r.manual} semi={r.semi} aut={r.auto} total={r.total}/>
                  <div className="flex justify-between mt-1.5 text-[9px] text-gray-400">
                    <span><span className="font-bold text-amber-600">{r.manual}</span> M</span>
                    <span><span className="font-bold text-blue-600">{r.semi}</span> S</span>
                    <span><span className="font-bold text-green-600">{r.auto}</span> A</span>
                  </div>
                  {r.auto > 0 && (
                    <div className="mt-2 text-[10px] text-center">
                      <span className="bg-green-50 text-green-700 font-bold px-2 py-0.5 rounded-full">
                        {r.pctAuto}% automatizado
                      </span>
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ══════════════════════
       TAB: CATÁLOGO
    ══════════════════════ */
    function Catalogo() {
      const [search, setSearch] = useState('');
      const [fEnt, setFEnt]   = useState('');
      const [fMp,  setFMp]    = useState('');
      const [fRs,  setFRs]    = useState('');
      const [fCl,  setFCl]    = useState('');
      const [fPri, setFPri]   = useState('');
      const [page, setPage]   = useState(1);
      const PER_PAGE = 20;

      const entidades  = useMemo(() => uniq(PROC_RAW, r => r.ent), []);
      const macros     = useMemo(() => uniq(PROC_RAW, r => r.mp), []);
      const resps      = useMemo(() => uniq(PROC_RAW, r => r.rs), []);
      const clases     = ['Manual', 'Semiautomático', 'Automático'];
      const prioridades = ['Alta', 'Medio', 'Bajo'];

      const filtered = useMemo(() => {
        const q = search.toLowerCase();
        return PROC_RAW.filter(r =>
          (!fEnt || r.ent === fEnt) &&
          (!fMp  || r.mp  === fMp)  &&
          (!fRs  || r.rs  === fRs)  &&
          (!fCl  || r.cl  === fCl)  &&
          (!fPri || r.pri === fPri) &&
          (!q || [r.mp,r.pr,r.pc,r.rs].some(f => f && f.toLowerCase().includes(q)))
        );
      }, [search, fEnt, fMp, fRs, fCl, fPri]);

      const pages    = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
      const safePage = Math.min(page, pages);
      const visible  = filtered.slice((safePage-1)*PER_PAGE, safePage*PER_PAGE);

      const resetFilters = () => { setSearch(''); setFEnt(''); setFMp(''); setFRs(''); setFCl(''); setFPri(''); setPage(1); };

      const Sel = ({val,setVal,opts,placeholder}) => (
        <div className="relative">
          <select value={val} onChange={e=>{setVal(e.target.value);setPage(1);}}

            <option value="">{placeholder}</option>
            {opts.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
          <svg className="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2.5" strokeLinecap="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      );

      return (
        <div className="space-y-4">
          {/* Filtros */}
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 space-y-3">
            <div className="flex items-center justify-between">
              <h2 className="font-montserrat font-bold text-ng-oscuro text-[10px] uppercase tracking-widest">Filtros</h2>
              <button onClick={resetFilters} className="text-[10px] text-ng-verde font-semibold hover:underline">↺ Limpiar</button>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              <div className="relative">
                <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} placeholder="Buscar procedimiento, proceso..."
                  className="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-xl text-xs text-gray-700 focus:outline-none focus:ring-2 focus:ring-ng-claro"/>
                <svg className="absolute left-2.5 top-1/2 -translate-y-1/2" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              </div>
              <Sel val={fEnt}  setVal={setFEnt}  opts={entidades}   placeholder="Todas las entidades"/>
              <Sel val={fMp}   setVal={setFMp}   opts={macros}      placeholder="Todos los macroprocesos"/>
              <Sel val={fRs}   setVal={setFRs}   opts={resps}       placeholder="Todos los responsables"/>
              <Sel val={fCl}   setVal={setFCl}   opts={clases}      placeholder="Toda clasificación"/>
              <Sel val={fPri}  setVal={setFPri}  opts={prioridades} placeholder="Toda prioridad"/>
            </div>
            <div className="text-[10px] text-gray-400">
              <span className="font-bold text-ng-verde">{filtered.length}</span> de {PROC_RAW.length} procedimientos
            </div>
          </div>

          {/* Tabla */}
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-xs min-w-[900px]">
                <thead>
                  <tr className="bg-ng-suave border-b border-ng-medio">
                    {['N°','Entidad','Macroproceso','Proceso','Procedimiento','Responsable','Pasos','Aut.','Clase','Prioridad'].map((h,i)=>(
                      <th key={h} className={`py-2.5 text-[9px] font-bold text-ng-oscuro uppercase tracking-wider whitespace-nowrap ${i===0?'px-3 text-center':(i>=6?'px-3 text-right':'px-3 text-left')}`}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {visible.map((r,i) => {
                    const cc = claseColor(r.cl);
                    const pc = r.pri ? prioColor(r.pri) : null;
                    return (
                      <tr key={i} className="hover:bg-gray-50 transition-colors">
                        <td className="px-3 py-2 text-center font-mono text-gray-400">{r.id}</td>
                        <td className="px-3 py-2 text-gray-500 whitespace-nowrap">{r.ent}</td>
                        <td className="px-3 py-2 text-gray-700 max-w-[180px] truncate" title={r.mp}>{r.mp}</td>
                        <td className="px-3 py-2 text-gray-600 max-w-[140px] truncate" title={r.pr}>{r.pr}</td>
                        <td className="px-3 py-2 font-medium text-gray-800 max-w-[200px] truncate" title={r.pc}>{r.pc}</td>
                        <td className="px-3 py-2 text-gray-600 whitespace-nowrap max-w-[160px] truncate" title={r.rs}>{r.rs}</td>

                        <td className="px-3 py-2 text-center">
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${cc.bg} ${cc.text}`}>{r.cl}</span>

                        <td className="px-3 py-2 text-center">
                          {pc && <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${pc.bg} ${pc.text}`}>{r.pri}</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {/* Paginación */}
            <div className="px-4 py-3 bg-gray-50 border-t border-gray-100 flex items-center justify-between flex-wrap gap-3">
              <span className="text-[10px] text-gray-400">Página {safePage} de {pages}</span>
              <div className="flex gap-2">
                <button onClick={()=>setPage(p=>Math.max(1,p-1))} disabled={safePage===1}
                  className="px-3 py-1 text-xs font-semibold border border-gray-200 rounded-lg disabled:opacity-30 hover:border-ng-claro hover:text-ng-verde transition-colors">
                  ← Anterior
                </button>
                <button onClick={()=>setPage(p=>Math.min(pages,p+1))} disabled={safePage===pages}
                  className="px-3 py-1 text-xs font-semibold border border-gray-200 rounded-lg disabled:opacity-30 hover:border-ng-claro hover:text-ng-verde transition-colors">
                  Siguiente →
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

          <div className="p-5 space-y-5">
            {/* KPIs */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
              {[
                {label:'Procesos Cobranzas', val: total_procesos},
                {label:'Manual + Semi',       val: manual_semi},
                {label:'Obj. Mejora Anual',   val: (obj_mejora_anual*100)+'%'},
                {label:'Cant. Pro. Mejora',   val: cant_pro_mejora},
              ].map(k=>(
                <div key={k.label} className="bg-ng-suave rounded-xl p-3 text-center">
                  <div className="font-montserrat font-black text-2xl text-ng-oscuro">{k.val}</div>
                  <div className="text-[10px] text-ng-verde font-semibold mt-0.5">{k.label}</div>
                </div>
              ))}
            </div>
            {/* Tabla meses */}
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50 border-b border-gray-200">
                    <th className="px-4 py-2 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Mes</th>
                    <th className="px-4 py-2 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">Mejorados</th>
                    <th className="px-4 py-2 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">Acumulado</th>
                    <th className="px-4 py-2 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">Objetivo</th>
                    <th className="px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider">Avance</th>
                    <th className="px-4 py-2 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">% vs Objetivo</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-100">
                  {meses.map((m,i) => {
                    const pct = m.objetivo > 0 ? (m.acumulado/cant_pro_mejora*100) : 0;
                    const ok  = m.acumulado >= m.objetivo;
                    return (
                      <tr key={i} className="hover:bg-gray-50">
                        <td className="px-4 py-2 font-semibold text-gray-700">{m.mes}</td>
                        <td className="px-4 py-2 text-right font-mono font-bold text-ng-verde">{m.mejorados || '—'}</td>
                        <td className="px-4 py-2 text-right font-mono text-gray-700">{m.acumulado}</td>
                        <td className="px-4 py-2 text-right font-mono text-gray-500">{m.objetivo}</td>
                        <td className="px-4 py-2 min-w-[120px]">
                          <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div className={`h-full rounded-full transition-all ${ok ? 'bg-green-500' : 'bg-amber-400'}`}
                              style={{width: `${Math.min(100,(m.acumulado/maxAcum)*100)}%`}}/>
                          </div>
                        </td>
                        <td className="px-4 py-2 text-right">
                          <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${ok ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}`}>
                            {pct.toFixed(0)}%
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════
       APP PRINCIPAL
    ══════════════════════ */
    const TABS = [
      { id: 'dashboard',   label: 'Resumen',     icon: '◈' },
      { id: 'ecosistema',  label: 'Ecosistema',  icon: '⬡' },
      { id: 'catalogo',    label: 'Catálogo',    icon: '≡' },
      { id: 'mejoras',     label: 'Mejoras',     icon: '⚡' },
    ];

    function App() {
      const [tab, setTab] = useState('dashboard');

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER */}
          <header className="bg-ng-oscuro shadow-xl">
            <div className="max-w-7xl mx-auto px-4 md:px-6 py-4 flex items-center gap-4">
              <div className="bg-white rounded-xl px-3 py-1.5 text-center shadow flex-shrink-0">
                <div className="font-montserrat font-black text-ng-oscuro text-sm leading-tight tracking-tight">NegoFIN</div>
                <div className="font-montserrat font-bold text-ng-oscuro text-[7px] tracking-[2.5px] leading-tight mt-0.5">S.A.E.C.A.</div>
              </div>
              <div className="flex-1 min-w-0">
                <h1 className="font-montserrat font-black text-white text-lg md:text-xl leading-tight">
                  Ecosistema de Procesos Empresariales
                </h1>
                <p className="text-white/45 text-xs mt-0.5">Gerencia de Organización y Procesos · 2026</p>
              </div>
              <div className="hidden sm:flex items-center gap-2 flex-shrink-0">
                <div className="text-right">
                  <div className="text-white/35 text-[9px] uppercase tracking-[2px] font-semibold">Procedimientos</div>
                  <div className="font-montserrat font-black text-white text-xl">{PROC_RAW.length}</div>
                </div>
              </div>
            </div>
            {/* Tabs */}
            <div className="border-t border-white/10 px-4 md:px-6 max-w-7xl mx-auto">
              <div className="flex gap-1">
                {TABS.map(t => (
                  <button key={t.id} onClick={()=>setTab(t.id)}
                    className={`px-4 py-3 text-xs font-bold transition-all flex items-center gap-1.5 border-b-2 ${
                      tab === t.id
                        ? 'text-white border-ng-claro'
                        : 'text-white/40 border-transparent hover:text-white/70'
                    }`}>
                    <span>{t.icon}</span>
                    <span>{t.label}</span>
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* MAIN */}
          <main className="max-w-7xl mx-auto w-full px-4 md:px-6 py-6 flex-1">
            {tab === 'dashboard'  && <Dashboard />}
            {tab === 'ecosistema' && <Ecosistema />}
            {tab === 'catalogo'   && <Catalogo />}
            {tab === 'mejoras'    && <Mejoras />}
          </main>

          {/* FOOTER */}
          <footer className="bg-ng-oscuro py-3 px-6 text-center">
            <p className="text-white/25 text-xs">
              <strong className="text-white/50">NegoFIN · Gerencia de Organización y Procesos</strong>
              {' '}&middot; Ecosistema de Procesos Empresariales &middot; 2026
            </p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
