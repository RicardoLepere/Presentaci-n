    /* ═══════════════════════════════
       SECTION: Ecosistema Negofin
    ═══════════════════════════════ */
    function SectionEcoNego() {
      const [fEnt, setFEnt] = useState('Todos');
      const entidades = ['Todos','NEGOFIN SA','ALIADOS COMERCIALES'];

      const filtered = useMemo(()=> fEnt==='Todos' ? PROC : PROC.filter(r=>r.ent===fEnt), [fEnt]);

      // Group by tipo, then macro
      const byTipo = useMemo(()=>{
        const map = {};
        filtered.forEach(r=>{
          if(!r.tm || !r.mp) return;
          if(!map[r.tm]) map[r.tm]={manual:0,semi:0,auto:0,macros:{}};
          if(!map[r.tm].macros[r.mp]) map[r.tm].macros[r.mp]={manual:0,semi:0,auto:0,procs:0};
          map[r.tm].macros[r.mp].procs++;
          if(r.cl==='Manual') { map[r.tm].manual++; map[r.tm].macros[r.mp].manual++; }
          else if(r.cl==='Semiautomático') { map[r.tm].semi++; map[r.tm].macros[r.mp].semi++; }
          else { map[r.tm].auto++; map[r.tm].macros[r.mp].auto++; }
        });
        return Object.entries(map).map(([tipo,st])=>({
          tipo, ...st,
          total: st.manual+st.semi+st.auto,
          macros: Object.entries(st.macros).map(([mp,ms])=>({
            mp, ...ms,
            total: ms.manual+ms.semi+ms.auto,
          })).sort((a,b)=>b.total-a.total),
        })).sort((a,b)=>{const o={Primario:0,Gestión:1,Soporte:2};return (o[a.tipo]??3)-(o[b.tipo]??3);});
      },[filtered]);

      return (
        <div className="space-y-4">
          {/* Filtro */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-center gap-3 flex-wrap">
            <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Entidad:</span>
            {entidades.map(e=>(
              <button key={e} onClick={()=>setFEnt(e)}
                className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition-all ${
                  fEnt===e ? 'bg-ng-oscuro text-white border-ng-oscuro shadow-sm' : 'bg-white text-gray-600 border-gray-200 hover:border-ng-claro'
                }`}>{e==='Todos' ? 'Todas las entidades' : e}</button>
            ))}
            <span className="text-xs text-gray-400 ml-auto">{filtered.length} procedimientos</span>
          </div>

          {/* Leyenda */}
          <div className="flex items-center gap-1 px-1 flex-wrap">
            {Object.entries(CLASE_CFG).map(([k,v])=>(
              <span key={k} className="flex items-center gap-1 text-xs text-gray-500 mr-3">
                <span className={`w-2.5 h-2.5 rounded ${v.bar}`}/>{k}
              </span>
            ))}
          </div>

          {/* Grid por tipo */}
          {byTipo.map(t=>{
            const cfg = tc(t.tipo);
            return (
              <div key={t.tipo} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div className={`px-6 py-3 flex items-center justify-between ${cfg.bg} border-b`}>
                  <div className="flex items-center gap-3">
                    <span className={`w-1 h-8 rounded-full ${cfg.side}`}/>
                    <span className={`font-montserrat font-black text-base ${cfg.text}`}>{t.tipo}</span>
                    <span className={`text-xs font-semibold ${cfg.text} opacity-60`}>{t.macros.length} macroprocesos</span>
                  </div>
                  <div className="flex items-center gap-4">
                    <AutoBar man={t.manual} semi={t.semi} aut={t.auto} total={t.total} h="h-2"/>
                    <span className={`font-montserrat font-black text-xl ${cfg.text}`}>{t.total}</span>
                  </div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-px bg-gray-100">
                  {t.macros.map(m=>(
                    <div key={m.mp} className="bg-white px-5 py-4 hover:bg-gray-50 transition-colors">
                      <div className="flex items-start justify-between gap-2 mb-2">
                        <span className="text-sm font-semibold text-gray-800 leading-tight">{m.mp}</span>
                        <span className="font-montserrat font-black text-2xl text-gray-900 flex-shrink-0 leading-none">{m.total}</span>
                      </div>
                      <AutoBar man={m.manual} semi={m.semi} aut={m.auto} total={m.total} h="h-1.5"/>
                      <div className="flex justify-between text-[9px] text-gray-400 mt-1.5">
                        <span><b className="text-amber-600">{m.manual}</b> M</span>
                        <span><b className="text-blue-500">{m.semi}</b> S</span>
                        <span><b className="text-green-600">{m.auto}</b> A</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      );
    }

    /* ═══════════════════════════════
       SECTION: Por Responsable
    ═══════════════════════════════ */
    function SectionEcoResp() {
      const [fEnt, setFEnt] = useState('Todos');
      const [fTipo,setFTipo]= useState('Todos');
      const entidades = ['Todos','NEGOFIN SA','ALIADOS COMERCIALES'];
      const tipos     = ['Todos','Primario','Soporte','Gestión'];

      const filtered = useMemo(()=>PROC.filter(r=>
        (fEnt==='Todos'||r.ent===fEnt) && (fTipo==='Todos'||r.tm===fTipo)
      ),[fEnt,fTipo]);

      const byResp = useMemo(()=>{
        const map = {};
        filtered.forEach(r=>{
          if(!r.rs) return;
          if(!map[r.rs]) map[r.rs]={total:0,manual:0,semi:0,auto:0,macros:new Set(),pa:0,pA:0};
          map[r.rs].total++;
          map[r.rs].macros.add(r.mp);
          if(r.pa) map[r.rs].pa+=r.pa;
          if(r.pA) map[r.rs].pA+=r.pA;
          if(r.cl==='Manual') map[r.rs].manual++;
          else if(r.cl==='Semiautomático') map[r.rs].semi++;
          else map[r.rs].auto++;
        });
        return Object.entries(map).map(([name,st])=>({
          name,...st,macros:st.macros.size,
          pctAuto: st.total ? Math.round((st.auto/st.total)*100) : 0,
          pctPasos: st.pa ? Math.round((st.pA/st.pa)*100) : 0,
        })).sort((a,b)=>b.total-a.total);
      },[filtered]);

      return (
        <div className="space-y-4">
          {/* Filtros */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-wrap gap-4 items-center">
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Entidad:</span>
              {entidades.map(e=>(
                <button key={e} onClick={()=>setFEnt(e)}
                  className={`text-xs font-semibold px-3 py-1 rounded-full border transition-all ${
                    fEnt===e?'bg-blue-600 text-white border-blue-600':'bg-white text-gray-600 border-gray-200 hover:border-blue-400'}`}>{e==='Todos'?'Todas':e==='NEGOFIN SA'?'NegoFIN':'Aliados'}</button>
              ))}
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Tipo:</span>
              {tipos.map(t=>(
                <button key={t} onClick={()=>setFTipo(t)}
                  className={`text-xs font-semibold px-3 py-1 rounded-full border transition-all ${
                    fTipo===t?'bg-violet-600 text-white border-violet-600':'bg-white text-gray-600 border-gray-200 hover:border-violet-400'}`}>{t}</button>
              ))}
            </div>
          </div>

          {/* Cards */}
          <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
            {byResp.map(r=>(
              <div key={r.name} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow">
                <div className="bg-gradient-to-r from-blue-600 to-blue-700 px-5 py-4">
                  <div className="flex items-start justify-between gap-2">
                    <div>
                      <div className="text-white font-bold text-sm leading-tight">{r.name}</div>
                      <div className="text-blue-200 text-[10px] mt-0.5">{r.macros} macroproceso{r.macros!==1?'s':''}</div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <div className="font-montserrat font-black text-3xl text-white leading-none">{r.total}</div>
                      <div className="text-blue-200 text-[9px]">proced.</div>
                    </div>
                  </div>
                </div>
                <div className="p-4 space-y-3">
                  <AutoBar man={r.manual} semi={r.semi} aut={r.auto} total={r.total} h="h-2"/>
                  <div className="flex justify-between text-xs">
                    <div className="text-center">
                      <div className="font-bold text-amber-600">{r.manual}</div>
                      <div className="text-gray-400 text-[9px]">Manual</div>
                    </div>
                    <div className="text-center">
                      <div className="font-bold text-blue-500">{r.semi}</div>

    /* ═══════════════════════════════
       SECTION: Por Macroproceso
    ═══════════════════════════════ */
    function SectionEcoMacro() {
      const [fTipo, setFTipo] = useState('Todos');
      const tipos = ['Todos','Primario','Soporte','Gestión'];

      const filtered = useMemo(()=> fTipo==='Todos' ? PROC : PROC.filter(r=>r.tm===fTipo),[fTipo]);

      const byMacro = useMemo(()=>{
        const map = {};
        filtered.forEach(r=>{
          if(!r.mp) return;
          if(!map[r.mp]) map[r.mp]={manual:0,semi:0,auto:0,tipo:r.tm,resps:new Set(),procs:new Set()};
          map[r.mp].resps.add(r.rs);
          map[r.mp].procs.add(r.pr);
          if(r.cl==='Manual') map[r.mp].manual++;
          else if(r.cl==='Semiautomático') map[r.mp].semi++;
          else map[r.mp].auto++;
        });
        return Object.entries(map).map(([name,st])=>({
          name,...st,
          total:st.manual+st.semi+st.auto,
          resps:st.resps.size,procs:st.procs.size,
        })).sort((a,b)=>{
          const o={Primario:0,Gestión:1,Soporte:2};
          return (o[a.tipo]??3)-(o[b.tipo]??3)||b.total-a.total;
        });
      },[filtered]);

      const tipo_totals = useMemo(()=>{
        const m={};
        byMacro.forEach(r=>{
          if(!m[r.tipo]) m[r.tipo]={manual:0,semi:0,auto:0,total:0};
          m[r.tipo].manual+=r.manual; m[r.tipo].semi+=r.semi;
          m[r.tipo].auto+=r.auto; m[r.tipo].total+=r.total;
        });
        return m;
      },[byMacro]);

      const tipoGroups = ['Primario','Gestión','Soporte'].filter(t=> fTipo==='Todos' || t===fTipo);

      return (
        <div className="space-y-4">
          {/* Filtro tipo */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-center gap-3 flex-wrap">
            <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Tipo:</span>
            {tipos.map(t=>{
              const cfg = tc(t);
              return (
                <button key={t} onClick={()=>setFTipo(t)}
                  className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition-all ${
                    fTipo===t?`${cfg.side} text-white border-transparent`:'bg-white text-gray-600 border-gray-200 hover:border-gray-400'
                  }`}>{t}</button>
              );
            })}
          </div>

          {tipoGroups.map(tipo=>{
            const rows  = byMacro.filter(m=>m.tipo===tipo);
            if(!rows.length) return null;
            const tot   = tipo_totals[tipo]||{};
            const cfg   = tc(tipo);
            const maxT  = Math.max(...rows.map(r=>r.total),1);
            return (
              <div key={tipo} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div className={`px-6 py-3 ${cfg.bg} border-b flex items-center justify-between`}>
                  <div className="flex items-center gap-3">
                    <span className={`w-1 h-8 rounded-full ${cfg.side}`}/>
                    <span className={`font-montserrat font-black text-base ${cfg.text}`}>{tipo}</span>
                    <span className={`text-xs ${cfg.text} opacity-60`}>{rows.length} macroprocesos</span>
                  </div>
                  <div className="flex items-center gap-3">
                    <AutoBar man={tot.manual||0} semi={tot.semi||0} aut={tot.auto||0} total={tot.total||1} h="h-2"/>
                    <span className={`font-montserrat font-black text-lg ${cfg.text}`}>{tot.total}</span>
                  </div>
                </div>
                <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-gray-50 border-b border-gray-100">
                      <th className="px-6 py-2 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Macroproceso</th>
                      <th className="px-4 py-2 text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider">Proc.</th>
                      <th className="px-4 py-2 text-center text-[10px] font-bold text-gray-400 uppercase tracking-wider">Resp.</th>
                      <th className="px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider min-w-[160px]">Distribución</th>
                      <th className="px-4 py-2 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-50">
                    {rows.map((m,i)=>(
                      <tr key={i} className="hover:bg-gray-50">
                        <td className="px-6 py-3 font-medium text-gray-800">{m.name}</td>
                        <td className="px-4 py-3 text-center text-gray-500">{m.procs}</td>
                        <td className="px-4 py-3 text-center text-gray-500">{m.resps}</td>
                        <td className="px-4 py-3">
                          <AutoBar man={m.manual} semi={m.semi} aut={m.auto} total={m.total} h="h-2"/>
                          <div className="flex justify-between text-[9px] text-gray-400 mt-1">
                            <span>{m.manual}M</span><span>{m.semi}S</span><span>{m.auto}A</span>
                          </div>
                        </td>
                        <td className="px-4 py-3 text-right">
                          <div className="flex items-center justify-end gap-2">
                            <div className="w-16 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                              <div className={`h-full rounded-full ${cfg.side}`} style={{width:`${(m.total/maxT)*100}%`}}/>
                            </div>
                            <span className="font-bold text-gray-900 w-5 text-right">{m.total}</span>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            );
          })}
        </div>
      );
    }

    /* ═══════════════════════════════
       SECTION: TD Eco. Respon. (Aut.)
    ═══════════════════════════════ */
    function SectionAutResp() {
      const byResp = useMemo(()=>{
        const map={};
        PROC.forEach(r=>{
          if(!r.rs) return;
          if(!map[r.rs]) map[r.rs]={total:0,manual:0,semi:0,auto:0};
          map[r.rs].total++;
          if(r.cl==='Manual') map[r.rs].manual++;
          else if(r.cl==='Semiautomático') map[r.rs].semi++;
          else map[r.rs].auto++;
        });
        return Object.entries(map).map(([name,st])=>({
          name,...st,
          pMan:((st.manual/st.total)*100).toFixed(1),
          pSemi:((st.semi/st.total)*100).toFixed(1),
          pAuto:((st.auto/st.total)*100).toFixed(1),
        })).sort((a,b)=>b.total-a.total);
      },[]);

      const totM = byResp.reduce((s,r)=>s+r.manual,0);
      const totS = byResp.reduce((s,r)=>s+r.semi,0);
      const totA = byResp.reduce((s,r)=>s+r.auto,0);
      const totT = byResp.reduce((s,r)=>s+r.total,0);

      return (
        <div className="space-y-4">
          {/* Resumen general */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">General — NEGOFIN SA</h3>
            <div className="grid grid-cols-3 gap-4 mb-4">
              {[
                {label:'Manual',        count:totM, pct:((totM/totT)*100).toFixed(1), bg:'bg-amber-50',  text:'text-amber-700',  bar:'bg-amber-400'},
                {label:'Semiautomático',count:totS, pct:((totS/totT)*100).toFixed(1), bg:'bg-blue-50',   text:'text-blue-700',   bar:'bg-blue-400'},
                {label:'Automático',    count:totA, pct:((totA/totT)*100).toFixed(1), bg:'bg-green-50',  text:'text-green-700',  bar:'bg-green-500'},
              ].map(c=>(
                <div key={c.label} className={`rounded-xl p-4 ${c.bg}`}>
                  <div className={`text-2xl font-montserrat font-black ${c.text}`}>{c.count}</div>
                  <div className={`text-xs font-semibold ${c.text}`}>{c.label}</div>
                  <div className={`text-[10px] ${c.text} opacity-70`}>{c.pct}%</div>
                </div>
              ))}
            </div>
            <AutoBar man={totM} semi={totS} aut={totA} total={totT} h="h-3"/>
          </div>

          {/* Tabla por responsable */}
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="px-5 py-3 border-b border-gray-100">
              <h3 className="font-bold text-sm text-gray-800">Automatización por Responsable</h3>
            </div>
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200">
                  <th className="px-5 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Responsable</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider text-amber-500">Manual</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider text-blue-500">Semi</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider text-green-500">Auto</th>
                  <th className="px-4 py-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider min-w-[180px]">Distribución</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">% Auto</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-50">
                {byResp.map((r,i)=>(
                  <tr key={i} className="hover:bg-gray-50">
                    <td className="px-5 py-3 font-medium text-gray-800">{r.name}</td>
                    <td className="px-4 py-3 text-right font-bold text-gray-900">{r.total}</td>
                    <td className="px-4 py-3 text-right text-amber-600">{r.manual}</td>
                    <td className="px-4 py-3 text-right text-blue-500">{r.semi}</td>
                    <td className="px-4 py-3 text-right text-green-600 font-semibold">{r.auto}</td>
                    <td className="px-4 py-3"><AutoBar man={r.manual} semi={r.semi} aut={r.auto} total={r.total} h="h-2"/></td>
                    <td className="px-4 py-3 text-right">
                      <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${parseFloat(r.pAuto)>0?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>
                        {r.pAuto}%
                      </span>
                    </td>
                  </tr>
                ))}
                <tr className="bg-ng-suave border-t-2 border-ng-medio">
                  <td className="px-5 py-2.5 font-black text-ng-oscuro text-xs uppercase tracking-wide">TOTAL</td>
                  <td className="px-4 py-2.5 text-right font-black text-ng-oscuro">{totT}</td>
                  <td className="px-4 py-2.5 text-right font-black text-amber-600">{totM}</td>
                  <td className="px-4 py-2.5 text-right font-black text-blue-500">{totS}</td>
                  <td className="px-4 py-2.5 text-right font-black text-green-600">{totA}</td>
                  <td className="px-4 py-2.5"><AutoBar man={totM} semi={totS} aut={totA} total={totT} h="h-2"/></td>
                  <td className="px-4 py-2.5 text-right font-black text-ng-verde">{((totA/totT)*100).toFixed(1)}%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════
       SECTION: TD Eco. Macro (Aut.)
    ═══════════════════════════════ */
    function SectionAutMacro() {
      const [fTipo, setFTipo] = useState('');
      const tipos = ['Primario','Soporte','Gestión'];

      const byMacro = useMemo(()=>{
        const map={};
        PROC.forEach(r=>{
          if(!r.mp) return;
          if(!map[r.mp]) map[r.mp]={total:0,manual:0,semi:0,auto:0,tipo:r.tm};
          map[r.mp].total++;
          if(r.cl==='Manual') map[r.mp].manual++;
          else if(r.cl==='Semiautomático') map[r.mp].semi++;
          else map[r.mp].auto++;
        });
        return Object.entries(map)
          .map(([name,st])=>({name,...st,pAuto:st.total?((st.auto/st.total)*100).toFixed(1):0}))
          .filter(r=>!fTipo||r.tipo===fTipo)
          .sort((a,b)=>{const o={Primario:0,Gestión:1,Soporte:2};return (o[a.tipo]??3)-(o[b.tipo]??3)||b.total-a.total;});
      },[fTipo]);

      const tot={total:0,manual:0,semi:0,auto:0};
      byMacro.forEach(r=>{tot.total+=r.total;tot.manual+=r.manual;tot.semi+=r.semi;tot.auto+=r.auto;});

      return (
        <div className="space-y-4">
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex items-center gap-3 flex-wrap">
            <span className="text-xs font-bold text-gray-400 uppercase tracking-wider">Tipo de Macro:</span>
            {[{v:'',l:'Todos'},...tipos.map(t=>({v:t,l:t}))].map(opt=>(
              <button key={opt.v} onClick={()=>setFTipo(opt.v)}
                className={`text-xs font-semibold px-3 py-1.5 rounded-full border transition-all ${
                  fTipo===opt.v?'bg-violet-600 text-white border-violet-600':'bg-white text-gray-600 border-gray-200 hover:border-violet-400'}`}>{opt.l}</button>
            ))}
          </div>

          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table className="w-full text-sm">
              <thead>
                <tr className="bg-gray-50 border-b border-gray-200">
                  <th className="px-5 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Macroproceso</th>
                  <th className="px-4 py-3 text-left text-[10px] font-bold text-gray-400 uppercase tracking-wider">Tipo</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">Total</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-amber-500 uppercase tracking-wider">Manual</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-blue-500 uppercase tracking-wider">Semi</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-green-500 uppercase tracking-wider">Auto</th>
                  <th className="px-4 py-3 text-[10px] font-bold text-gray-400 uppercase tracking-wider min-w-[160px]">Distribución</th>
                  <th className="px-4 py-3 text-right text-[10px] font-bold text-gray-400 uppercase tracking-wider">% Auto</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-gray-50">
                {byMacro.map((m,i)=>{
                  const cfg=tc(m.tipo);
                  return (
                    <tr key={i} className="hover:bg-gray-50">
                      <td className="px-5 py-3 font-medium text-gray-800">{m.name}</td>
                      <td className="px-4 py-3">
                        <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${cfg.bg} ${cfg.text}`}>{m.tipo}</span>
                      </td>
                      <td className="px-4 py-3 text-right font-bold text-gray-900">{m.total}</td>
                      <td className="px-4 py-3 text-right text-amber-600">{m.manual}</td>
                      <td className="px-4 py-3 text-right text-blue-500">{m.semi}</td>
                      <td className="px-4 py-3 text-right text-green-600 font-semibold">{m.auto}</td>
                      <td className="px-4 py-3"><AutoBar man={m.manual} semi={m.semi} aut={m.auto} total={m.total} h="h-2"/></td>
                      <td className="px-4 py-3 text-right">
                        <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${parseFloat(m.pAuto)>0?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}`}>
                          {m.pAuto}%
                        </span>
                      </td>
                    </tr>
                  );
                })}
                <tr className="bg-ng-suave border-t-2 border-ng-medio">
                  <td className="px-5 py-2.5 font-black text-ng-oscuro text-xs uppercase" colSpan={2}>TOTAL</td>
                  <td className="px-4 py-2.5 text-right font-black text-ng-oscuro">{tot.total}</td>
                  <td className="px-4 py-2.5 text-right font-black text-amber-600">{tot.manual}</td>
                  <td className="px-4 py-2.5 text-right font-black text-blue-500">{tot.semi}</td>
                  <td className="px-4 py-2.5 text-right font-black text-green-600">{tot.auto}</td>
                  <td className="px-4 py-2.5"><AutoBar man={tot.manual} semi={tot.semi} aut={tot.auto} total={tot.total} h="h-2"/></td>
                  <td className="px-4 py-2.5 text-right font-black text-ng-verde">{((tot.auto/tot.total)*100).toFixed(1)}%</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════
       SECTION: Ind. Cobranzas
    ═══════════════════════════════ */
    function SectionCobranzas() {
      const { total_procesos, manual_semi, obj_mejora_anual, cant_pro_mejora, meses } = IND_COB;
      const totalPasos = COB_BD.reduce((s,r)=>s+(r.pa||0),0);
      const totalAut   = COB_BD.reduce((s,r)=>s+(r.pA||0),0);
      const pctGlobal  = totalPasos ? ((totalAut/totalPasos)*100).toFixed(1) : 0;
      const maxVal     = Math.max(...meses.map(m=>m.objetivo), cant_pro_mejora, 1);

      return (
        <div className="space-y-5">
          {/* KPIs */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            {[
              {label:'Procesos Cobranzas', val:total_procesos, color:'bg-ng-oscuro'},
              {label:'Manual + Semi',       val:manual_semi,   color:'bg-amber-600'},
              {label:'Obj. Mejora Anual',   val:(obj_mejora_anual*100)+'%', color:'bg-ng-verde'},
              {label:'Automatiz. Global',   val:pctGlobal+'%', color:'bg-emerald-600'},
            ].map(k=>(
              <div key={k.label} className={`rounded-2xl p-5 text-white ${k.color} shadow-sm`}>
                <div className="font-montserrat font-black text-4xl leading-none">{k.val}</div>
                <div className="text-[10px] font-bold opacity-70 uppercase tracking-wider mt-2">{k.label}</div>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-1 xl:grid-cols-2 gap-5">
            {/* Seguimiento mensual */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="px-5 py-3 border-b border-gray-100 flex items-center gap-2">
                <span className="w-2 h-5 bg-green-500 rounded-full"/>
                <h3 className="font-bold text-sm text-gray-800">Seguimiento Mensual de Mejoras</h3>
                <span className="text-xs text-gray-400 ml-auto">Meta anual: {cant_pro_mejora} procedimientos</span>
              </div>
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-gray-50 border-b border-gray-100">
                    {['Mes','Mejorados','Acumulado','Objetivo','Avance','% Meta'].map((h,i)=>(
                      <th key={h} className={`px-4 py-2 text-[10px] font-bold text-gray-400 uppercase tracking-wider ${i>=1?'text-right':''}`}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {meses.map((m,i)=>{
                    const pct = cant_pro_mejora > 0 ? (m.acumulado/cant_pro_mejora*100) : 0;
                    const ok  = m.objetivo > 0 && m.acumulado >= m.objetivo;
                    return (
                      <tr key={i} className={`hover:bg-gray-50 ${ok?'':'opacity-90'}`}>
                        <td className="px-4 py-2.5 font-semibold text-gray-700">{m.mes}</td>
                        <td className="px-4 py-2.5 text-right font-bold text-ng-verde">{m.mejorados||'—'}</td>
                        <td className="px-4 py-2.5 text-right font-mono text-gray-700">{m.acumulado}</td>
                        <td className="px-4 py-2.5 text-right font-mono text-gray-400">{m.objetivo}</td>
                        <td className="px-4 py-2.5 min-w-[100px]">
                          <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
                            <div className={`h-full rounded-full ${ok?'bg-green-500':'bg-amber-400'}`}
                              style={{width:`${Math.min(100,(m.acumulado/maxVal)*100)}%`}}/>
                          </div>
                        </td>
                        <td className="px-4 py-2.5 text-right">
                          <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full ${ok?'bg-green-100 text-green-700':'bg-amber-50 text-amber-700'}`}>
                            {pct.toFixed(0)}%
                          </span>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Análisis paso a paso */}
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
              <div className="px-5 py-3 border-b border-gray-100 flex items-center gap-2">
                <span className="w-2 h-5 bg-blue-500 rounded-full"/>
                <h3 className="font-bold text-sm text-gray-800">Análisis por Paso — Fuente: BD</h3>
                <span className="text-xs font-bold text-ng-verde ml-auto">{pctGlobal}% automatización</span>
              </div>
              <table className="w-full text-xs">
                <thead>
                  <tr className="bg-gray-50 border-b border-gray-100">
                    {['Procedimiento','Pasos','Aut.','%','Estado','Barra'].map((h,i)=>(
                      <th key={h} className={`px-3 py-2 text-[9px] font-bold text-gray-400 uppercase tracking-wider ${i>=1&&i<=3?'text-right':'text-left'}`}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-50">
                  {COB_BD.map((r,i)=>{
                    const pct=r.pa?Math.round((r.pA/r.pa)*100):0;
                    const cfg=cc(r.cl);
                    return (
                      <tr key={i} className="hover:bg-gray-50">
                        <td className="px-3 py-2 font-medium text-gray-800">{r.pc}</td>
                        <td className="px-3 py-2 text-right font-mono">{r.pa}</td>
                        <td className="px-3 py-2 text-right font-mono font-bold text-ng-verde">{r.pA}</td>
                        <td className="px-3 py-2 text-right font-mono">{pct}%</td>
                        <td className="px-3 py-2">
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${cfg.bg} ${cfg.text}`}>{r.cl}</span>
                        </td>
                        <td className="px-3 py-2 min-w-[80px]">
                          <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                            <div className={`h-full rounded-full ${cfg.bar}`} style={{width:pct+'%'}}/>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                  <tr className="bg-ng-suave border-t-2 border-ng-medio font-bold text-xs">
                    <td className="px-3 py-2 font-black text-ng-oscuro">TOTAL</td>
                    <td className="px-3 py-2 text-right font-mono text-ng-oscuro">{totalPasos}</td>
                    <td className="px-3 py-2 text-right font-mono text-ng-verde">{totalAut}</td>
                    <td className="px-3 py-2 text-right font-mono font-black text-ng-verde">{pctGlobal}%</td>
                    <td colSpan={2}/>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════
       SIDEBAR
    ═══════════════════════════════ */
    function Sidebar({ active, setActive, collapsed, setCollapsed }) {
      return (
        <aside className={`flex-shrink-0 flex flex-col bg-sidebar h-full overflow-y-auto transition-all duration-200 ${collapsed?'w-14':'w-56'}`}>
          {/* Logo */}
          <div className={`flex items-center gap-3 px-4 py-4 border-b border-white/10 ${collapsed?'justify-center':''}`}>
            <div className="bg-ng-claro rounded-xl w-8 h-8 flex items-center justify-center flex-shrink-0 shadow">
              <span className="text-white font-montserrat font-black text-xs">N</span>
            </div>
            {!collapsed && (
              <div className="min-w-0">
                <div className="font-montserrat font-black text-white text-sm leading-tight">NegoFIN</div>
                <div className="text-white/40 text-[9px] tracking-widest">S.A.E.C.A.</div>
              </div>
            )}
            <button onClick={()=>setCollapsed(!collapsed)} className={`ml-auto text-white/30 hover:text-white/70 transition-colors ${collapsed?'hidden':''}`}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
          </div>
          {collapsed && (
            <button onClick={()=>setCollapsed(false)} className="flex justify-center py-2 text-white/30 hover:text-white/70 border-b border-white/10">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          )}

          {/* Nav */}
          <nav className="flex-1 py-3">
            {NAV.map(grp=>(
              <div key={grp.group} className="mb-3">
                {!collapsed && (
                  <div className="px-4 py-1 text-[9px] font-black text-white/25 uppercase tracking-[2px]">{grp.group}</div>
                )}
                {grp.items.map(item=>{
                  const isActive = active===item.id;
                  return (
                    <button key={item.id} onClick={()=>setActive(item.id)}
                      title={collapsed?item.label:''}
                      style={isActive?{'--accent':item.color, borderLeftColor:item.color}:{}}
                      className={`w-full flex items-center gap-3 px-4 py-2.5 text-left sidebar-item transition-all ${
                        isActive ? 'active text-white' : 'text-white/50 hover:text-white/80'
                      } ${collapsed?'justify-center':''}`}>
                      <span style={{color:isActive?item.color:'inherit'}} className="text-base flex-shrink-0 leading-none">{item.icon}</span>
                      {!collapsed && (
                        <span className={`text-xs font-semibold leading-tight truncate ${isActive?'text-white':'text-white/60'}`}>{item.label}</span>
                      )}
                      {!collapsed && isActive && (
                        <span style={{backgroundColor:item.color}} className="ml-auto w-1.5 h-1.5 rounded-full flex-shrink-0"/>
                      )}
                    </button>
                  );
                })}
              </div>
            ))}
          </nav>

          {/* Footer */}
          {!collapsed && (
            <div className="px-4 py-3 border-t border-white/10 text-[9px] text-white/20 text-center">
              Ecosistema de Procesos · 2026
            </div>
          )}
        </aside>
      );
    }

    /* ═══════════════════════════════
       APP PRINCIPAL
    ═══════════════════════════════ */
    const SECTION_MAP = {
      'td':        SectionTD,
      'gerencia':  SectionGerencia,
      'eco-nego':  SectionEcoNego,
      'eco-resp':  SectionEcoResp,
      'eco-macro': SectionEcoMacro,
      'bd':        SectionBD,
      'procesos':  SectionProcesos,
      'aut-resp':  SectionAutResp,
      'aut-macro': SectionAutMacro,
      'cobranzas': SectionCobranzas,
    };

    function App() {
      const [active,    setActive]    = useState('td');
      const [collapsed, setCollapsed] = useState(false);

      const item    = ALL_ITEMS.find(i=>i.id===active) || ALL_ITEMS[0];
      const Section = SECTION_MAP[active] || SectionTD;

      return (
        <div className="flex w-full h-full overflow-hidden bg-gray-100">
          <Sidebar active={active} setActive={setActive} collapsed={collapsed} setCollapsed={setCollapsed}/>

          {/* Main content */}
          <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
            {/* Page header */}
            <header className="flex-shrink-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center gap-4 shadow-sm">
              <div className="flex items-center gap-3 min-w-0">
                <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white text-base flex-shrink-0 shadow-sm"
                  style={{backgroundColor:item.color}}>
                  {item.icon}
                </div>
                <div className="min-w-0">
                  <h1 className="font-montserrat font-black text-gray-900 text-base leading-tight truncate">{item.label}</h1>
                  <p className="text-gray-400 text-[10px] truncate">Excel: <span className="font-medium text-gray-500">{item.sheet}</span></p>
                </div>
              </div>
              <div className="ml-auto flex items-center gap-3 flex-shrink-0">
                <div className="text-right hidden sm:block">
                  <div className="text-[9px] text-gray-400 uppercase tracking-wider">Total procedimientos</div>
                  <div className="font-montserrat font-black text-gray-900 text-lg leading-none">{PROC.length}</div>
                </div>
                <div className="w-8 h-8 rounded-full bg-ng-verde flex items-center justify-center text-white text-xs font-bold flex-shrink-0">
                  OyP
                </div>
              </div>
            </header>

            {/* Scrollable content */}
            <main className="flex-1 overflow-y-auto p-6">
              <Section/>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
